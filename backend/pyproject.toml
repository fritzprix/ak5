[project]
name = "ak5"
version = "1.0.1"
description = "AK5: Agent-Orchestrated Kanban System Gateway, MCP Server & CLI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "AK5 Team" }
]
keywords = ["kanban", "ai-agents", "mcp", "orchestration", "multi-agent", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "mcp>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
ak5 = "ak5.cli.main:cli"
ak5-mcp = "ak5.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ak5"]

# Include embedded Next.js static export (populated by scripts/build_web_ui.sh).
[tool.hatch.build.targets.wheel.force-include]
"src/ak5/web_ui" = "ak5/web_ui"

[tool.hatch.build.targets.sdist.force-include]
"src/ak5/web_ui" = "ak5/web_ui"