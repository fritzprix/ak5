[project]
name = "ak5"
version = "1.0.26"
description = "Self-hosted Kanban where AI agents pull work and humans give final approval — CLI, daemon, web UI, optional MCP"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "AK5 contributors" }
]
keywords = [
    "kanban",
    "ai-agents",
    "multi-agent",
    "mcp",
    "orchestration",
    "self-hosted",
    "human-in-the-loop",
    "fastapi",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business :: Groupware",
    "Environment :: Console",
    "Environment :: Web Environment",
]

dependencies = [
    # Client / daemon / CLI (daemon UDS IPC uses FastAPI + uvicorn)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/fritzprix/ak5"
Documentation = "https://github.com/fritzprix/ak5/blob/master/docs/MANUAL.md"
Repository = "https://github.com/fritzprix/ak5"
Issues = "https://github.com/fritzprix/ak5/issues"
Changelog = "https://github.com/fritzprix/ak5/releases"
PyPI = "https://pypi.org/project/ak5/"

[project.optional-dependencies]
server = [
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "webauthn>=2.5.0",
]
postgres = [
    "asyncpg>=0.29.0",
]
mcp = [
    "mcp>=2.2.0",
]

[project.scripts]
ak5 = "ak5.cli.main:cli"
ak5-mcp = "ak5.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ak5"]
