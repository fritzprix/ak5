name: Close linked issues on dev merge

# GitHub only honours closing keywords (Fixes/Closes/Resolves #N) for PRs merged
# into the default branch. Feature PRs land on the latest dev/MAJOR.MINOR.x
# branch, so close their linked issues here instead.

on:
  pull_request_target:
    types: [closed]
    branches:
      - "dev/*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to process"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: close-linked-issues-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  close-issues:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by closing keywords
        uses: actions/github-script@v7
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;

            const pr = context.eventName === "workflow_dispatch"
              ? (await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(process.env.DISPATCH_PR_NUMBER),
                })).data
              : context.payload.pull_request;

            if (!pr.merged_at) {
              core.info(`PR #${pr.number} is not merged; nothing to do.`);
              return;
            }

            const devBranch = /^dev\/(\d+)\.(\d+)\.x$/;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });
            const latest = branches
              .map((b) => b.name)
              .filter((name) => devBranch.test(name))
              .sort((a, b) => {
                const [, aMaj, aMin] = a.match(devBranch);
                const [, bMaj, bMin] = b.match(devBranch);
                return Number(bMaj) - Number(aMaj) || Number(bMin) - Number(aMin);
              })[0];

            if (pr.base.ref !== latest) {
              core.info(`PR #${pr.number} targets ${pr.base.ref}, latest dev branch is ${latest}; skipping.`);
              return;
            }

            // Ignore keywords inside code and HTML comments, as GitHub does.
            const text = `${pr.title}\n${pr.body ?? ""}`
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/```[\s\S]*?```/g, "")
              .replace(/`[^`\n]*`/g, "");

            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+(?:([\w.-]+)\/([\w.-]+))?#(\d+)\b/gi;
            const issueNumbers = new Set();
            for (const match of text.matchAll(keyword)) {
              const [, refOwner, refRepo, num] = match;
              const sameRepo = !refOwner
                || (refOwner.toLowerCase() === owner.toLowerCase()
                  && refRepo.toLowerCase() === repo.toLowerCase());
              if (sameRepo) issueNumbers.add(Number(num));
            }

            if (issueNumbers.size === 0) {
              core.info(`PR #${pr.number} has no closing keywords.`);
              return;
            }

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request; skipping.`);
                continue;
              }
              if (issue.state === "closed") {
                core.info(`#${issue_number} is already closed.`);
                continue;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Closed by #${pr.number}, merged into \`${pr.base.ref}\`.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${issue_number}.`);
            }
