name: Release AK5 to npm

on:
  workflow_dispatch:

jobs:
  publish-npm-sdk:
    name: Publish @ak5/sdk to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install & Build SDK
        working-directory: ./packages/sdk
        run: |
          npm ci
          npm run build

      - name: Publish @ak5/sdk to npm
        working-directory: ./packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  publish-npm-web:
    name: Publish Web Dashboard to npm (npx ak5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install & Build Next.js
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        working-directory: ./frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
