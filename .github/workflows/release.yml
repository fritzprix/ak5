name: Release AK5 to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-pypi:
    name: Publish Python Package to PyPI (uvx ak5)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Wheel & Source Tarball
        run: |
          chmod +x scripts/build_web_ui.sh scripts/smoke_uvx_wheel.sh
          ./scripts/build_web_ui.sh
          uv build backend --out-dir dist

      - name: Isolated wheel smoke (uvx-equivalent hard gate)
        run: |
          chmod +x scripts/smoke_uvx_wheel.sh
          ./scripts/smoke_uvx_wheel.sh

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
