name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build embedded web UI into Python package
        run: |
          chmod +x scripts/build_web_ui.sh scripts/smoke_uvx_wheel.sh
          ./scripts/build_web_ui.sh

      - name: Install dependencies
        run: |
          uv sync --all-packages

      - name: Run Pytest
        run: |
          uv run pytest

      - name: Run Ruff Lint
        run: |
          uvx ruff check backend

      - name: Build wheel + isolated uvx smoke gate
        run: |
          rm -rf dist
          uv build backend --out-dir dist
          ./scripts/smoke_uvx_wheel.sh

  frontend-sdk-ci:
    name: Frontend & SDK Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build SDK (@ak5/sdk)
        working-directory: ./packages/sdk
        run: |
          npm ci
          npm run build

      - name: Build & Lint Frontend Dashboard
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          export AK5_STATIC_EXPORT=1
          export NEXT_PUBLIC_API_URL=/api/v1
          if [ -f src/middleware.ts ]; then mv src/middleware.ts src/middleware.ts.ci_bak; fi
          trap 'if [ -f src/middleware.ts.ci_bak ]; then mv src/middleware.ts.ci_bak src/middleware.ts; fi' EXIT
          npm run build
