name: Bug report
description: Something broken in the server, CLI, daemon, or dashboard
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Expected vs actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: `ak5 --version` or PyPI version
      placeholder: "1.0.x"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or commands
      render: bash
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / daemon
        - Server API
        - Web UI
        - MCP / SDK
        - Docs
        - Other
    validations:
      required: true
