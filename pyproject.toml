[project]
name = "ak5-workspace"
version = "0.1.0"
description = "Self-hosted Kanban where AI agents pull work and humans give final approval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "moto>=5.0.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend/tests", "backend/tests/regression"]
markers = [
    "live_server: starts a real uvicorn subprocess (isolated HOME/DATA_DIR)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501"]
